# Nano decoder config — DEC-06 caps (16GB M4)
# n_layer ≤ 8, n_embd ≤ 512, n_head ≤ 8, block_size ≤ 512, vocab_size ≤ 16000
# Target param band: ~10–40M

vocab_size: 8000          # overwritten to match trained tokenizer
block_size: 256
n_layer: 6
n_head: 6
n_embd: 384
dropout: 0.0
bias: false

# Train defaults (16GB-safe)
batch_size: 8
grad_accum: 4
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 2000
eval_interval: 200
seed: 42
temperature_eval: 0.2
